name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Acr.WindowsForms.Controls.sln

      - name: Build
        run: dotnet build Acr.WindowsForms.Controls.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Acr.WindowsForms.Controls.Tests/Acr.WindowsForms.Controls.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: Acr.WindowsForms.Controls/bin/Release/*.nupkg
          if-no-files-found: ignore
